name: piwork-core
services:
  core:
    image: ${PIWORK_CORE_IMAGE:?必须选择已核对的 Core 发行镜像}
    init: true
    user: "0:0"
    network_mode: host
    command: ["serve", "--data-dir", "/var/lib/piwork/core", "--no-open"]
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/piwork/core
        target: /var/lib/piwork/core
        bind:
          create_host_path: true
      - type: bind
        source: /var/lib/piwork/core-exchange
        target: /var/lib/piwork/core-exchange
        bind:
          create_host_path: true
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:17891/healthz"]
      interval: 5s
      timeout: 4s
      retries: 120
      start_period: 10s
