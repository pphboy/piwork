name: piwork-core
services:
  core:
    image: ${PIWORK_CORE_IMAGE:?必须选择已核对的 Core 发行镜像}
    init: true
    user: "0:0"
    network_mode: host
    command: ["serve", "--allow-insecure-remote"]
    environment:
      PIWORK_ADMIN_ACCOUNT:
      PIWORK_ADMIN_PASSWORD:
      PIWORK_MODEL_PROVIDER:
      PIWORK_MODEL:
      PIWORK_API_KEY:
      PIWORK_MODEL_BASE_URL:
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONTEXT: ""
      PIWORK_DATA_DIR: /var/lib/piwork/core
      PIWORK_CORE_URL: http://127.0.0.1:7171
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/piwork/core
        target: /var/lib/piwork/core
        bind:
          create_host_path: true
      - type: bind
        source: /var/lib/piwork/core-exchange
        target: /var/lib/piwork/core-exchange
        bind:
          create_host_path: true
    stop_grace_period: 60s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://127.0.0.1:7171/readyz?profile=docker-delivery"]
      interval: 5s
      timeout: 4s
      retries: 120
      start_period: 10s
