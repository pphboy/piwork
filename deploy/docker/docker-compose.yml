name: piwork-quickstart
# Liveness keeps first-time setup accessible; /readyz tracks runtime preparation.
services:
  core:
    image: docker.io/pphboy/piwork-core:0.0.10-a6c36da16ebc-f1b82b8572fb-dirty
    init: true
    user: "0:0"
    network_mode: host
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/piwork/quickstart/core
        target: /var/lib/piwork/quickstart/core
        bind:
          create_host_path: true
    stop_grace_period: 60s
    restart: unless-stopped
