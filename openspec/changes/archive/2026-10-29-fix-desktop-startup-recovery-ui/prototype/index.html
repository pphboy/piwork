<body>
<nav class="review" aria-label="原型评审工具">
 <b>Piwork · 交互原型</b>
 <select id="scene" aria-label="选择预览场景">
  <option value="starting">01 · Core 正在启动</option><option value="ready">02 · 已恢复，菜单与历史</option><option value="work-recovering">03 · Core 就绪，单个 Work 恢复中</option><option value="work-failed">04 · 当前 Work 失败</option><option value="pending">05 · 操作结果未确认</option><option value="core-failed">06 · Core 准备失败</option><option value="unconfirmed">07 · Core 状态读取超时</option><option value="offline">08 · Core 不可达</option><option value="interrupted">09 · 使用中 Core 重新恢复</option><option value="workspace-ready">10 · 使用中恢复完成，草稿保留</option>
 </select>
 <span class="review-label">示意数据 · 切换场景查看</span>
 <div class="review-actions"><button id="finish-demo">模拟恢复完成</button><button id="scope">拟修复范围</button><button id="language">English</button></div>
</nav>
<header class="topbar"><div class="brand"><img src="piwork-logo.png" alt="Piwork"><span>Desktop</span></div><button class="account" id="account"><span class="avatar">A</span><b>admin</b><span id="account-chevron"></span></button></header>
<main id="app"></main>
<p class="readonly-note" id="prototype-note"></p>
<div id="menu" class="menu" role="menu" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><div><h2 id="dialog-title"></h2><p id="dialog-sub" class="sub"></p></div><button id="close-dialog" aria-label="关闭">✕</button></div><div class="dialog-body" id="dialog-body"></div><div class="dialog-foot"><button id="dialog-done">关闭</button></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const paths={grid:'<rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="15" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',down:'<path d="m6 9 6 6 6-6"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 7a8 8 0 0 1 12.8-2L20 7M4 17l1.7 2A8 8 0 0 0 18.5 17"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 14v6h16v-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',spark:'<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="9" cy="18" r="2" fill="white"/>',download:'<path d="M12 3v13m-5-5 5 5 5-5M4 16v5h16v-5"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',trash:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',warning:'<path d="m12 3 10 18H2L12 3Z M12 9v5m0 3h.01"/>',cloud:'<path d="M5 18a5 5 0 0 1-1-10 7 7 0 0 1 13-2 6 6 0 0 1 2 12H5Z"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.info}</svg>`;
let language='zh',scene=new URLSearchParams(location.search).get('scene')||'starting',menuWork=0,selectedWork=0,historyFilter='all',toastTimer,checkTimer,lastFocus=null,draftText=null;
if(![...document.querySelector('#scene').options].some(o=>o.value===scene))scene='starting';
const T=(zh,en)=>language==='zh'?zh:en;
const workNames=['视频策划2','B','C','A'];
const workIds=['work-demo-08fc158f','work-demo-60541980','work-demo-0366e35c','work-demo-81aa7539'];
const failedScenes=['work-failed','pending'];
function currentState(i){return i===0&&scene==='work-failed'?'failed':i===0&&scene==='pending'?'unknown':i===0&&scene==='work-recovering'?'recovering':'ready'}
function setScene(next){clearTimeout(checkTimer);scene=next;document.querySelector('#scene').value=scene;history.replaceState(null,'','?scene='+scene);closeMenu();document.querySelector('#dialog').close();render()}
function coreButton(label,kind='green'){return `<button class="core" data-do="core-info"><span class="dot ${kind}"></span>Core <span>·</span>${label}${icon('down')}</button>`}
function topActions(){return `<div class="toolbar"><label class="search">${icon('search')}<input id="search" aria-label="${T('搜索 Work','Search Works')}" placeholder="${T('搜索你的 Work','Search your Works')}"></label><div class="toolbar-actions">${coreButton(T('已连接','Connected'))}<button class="icon-btn" data-do="refresh" title="${T('刷新列表','Refresh Works')}" aria-label="${T('刷新列表','Refresh Works')}">${icon('refresh')}</button><button class="icon-btn" data-do="import" title="${T('导入 Work','Import Work')}" aria-label="${T('导入 Work','Import Work')}">${icon('upload')}</button><button class="icon-btn primary" data-do="new" title="${T('新建 Work','New Work')}" aria-label="${T('新建 Work','New Work')}">${icon('plus')}</button></div></div>`}
function workRows(query=''){return workNames.map((name,i)=>{if(!name.toLowerCase().includes(query.toLowerCase()))return '';const s=currentState(i),label=s==='failed'?T('启动失败','Startup failed'):s==='unknown'?T('操作结果未确认','Operation unconfirmed'):s==='recovering'?T('正在恢复','Recovering'):T('已就绪','Ready'),color=s==='ready'?'green':s==='failed'?'red':'amber';return `<div class="work-row"><div class="work-name"><div class="work-icon">${icon('grid')}</div><div><strong>${name}</strong><small>${workIds[i]}</small></div></div><div class="work-state ${color}"><span class="dot"></span>${label}${s==='failed'?`<small>${T('需要查看原因后重试','Review the cause before retrying')}</small>`:s==='unknown'?`<small>${T('正在核对原操作','Checking the original operation')}</small>`:s==='recovering'?`<small>${T('状态自动更新','Status updates automatically')}</small>`:''}</div><button class="quick" data-do="${s==='ready'?'open':s==='recovering'?'recovering-task':'current-task'}" data-work="${i}">${s==='ready'?T('打开 Work','Open Work'):s==='recovering'?T('查看进度','View progress'):s==='failed'?T('查看原因','View cause'):T('检查原操作','Check original')}</button><button class="icon-btn" data-do="menu" data-work="${i}" aria-label="${T('更多选项','More options')} · ${name}" aria-haspopup="menu" aria-expanded="false">${icon('more')}</button></div>`}).join('')||`<div class="empty-history">${T('未找到匹配的 Work','No matching Works')}</div>`}
function render(){document.querySelector('#scene').value=scene;document.documentElement.lang=language==='zh'?'zh-CN':'en';document.querySelector('#language').textContent=language==='zh'?'English':'简体中文';document.querySelector('#account-chevron').innerHTML=icon('down');document.querySelector('#prototype-note').textContent=T('评审原型 · 所有 Work、操作与错误均为示意数据。顶部深色栏仅用于切换演示场景，不属于产品界面。','Review prototype · All Works, operations and errors are illustrative. The dark scene toolbar is for this review only.');document.querySelector('#finish-demo').hidden=scene==='ready';if(['starting','core-failed','unconfirmed','offline'].includes(scene)){renderGate();return}if(['interrupted','workspace-ready'].includes(scene)){renderInterrupted();return}document.querySelector('#app').innerHTML=`${topActions()}<section class="works" aria-label="${T('Work 列表','Works')}"><div class="work-head"><span>${T('名称','NAME')}</span><span>${T('状态','STATUS')}</span><span class="quick-col">${T('快捷操作','QUICK ACTION')}</span><span></span></div><div id="rows">${workRows()}</div></section><div class="footer"><span>${icon('lock')}${T('这里只显示你自己的 Work','Only your own Works appear here')}</span><span>4 Works · admin</span></div><div class="help"><span class="symbol">${icon('spark')}</span><div><strong>${T('从一个想法开始，创造有用的东西。','Start with an idea. Make something useful.')}</strong><p>${T('为 Work 设定目标，然后与 Agent 一起构建和使用工具。','Give your Work a goal, then build and use its tools alongside the Agent.')}</p></div></div>`}
function renderGate(){const starting=scene==='starting',failed=scene==='core-failed',unknown=scene==='unconfirmed';const title=starting?T('Core 正在启动','Core is starting'):failed?T('Core 暂时无法就绪','Core could not become ready'):unknown?T('Core 状态尚未确认','Core status is not confirmed'):T('暂时无法连接 Core','Cannot reach Core');const copy=starting?T('正在准备运行环境并恢复 Work。就绪后将自动进入工作区。','Preparing the runtime and recovering Works. Your workspace will open automatically when ready.'):failed?T('运行环境准备失败。请查看原因，处理后重新检查状态。','Runtime preparation failed. Review the cause and check again after addressing it.'):unknown?T('本次状态读取已超时，暂时无法确认 Core 是否就绪。','This status read timed out. Core readiness has not been confirmed.'):T('连接请求未成功，请确认 Core 正在运行及网络连接正常。','The connection failed. Check that Core is running and the network is available.');const cause=failed?T('示例原因：Docker Engine 暂时不可用。','Illustrative cause: Docker Engine is unavailable.'):unknown?T('本次只读查询已超过 10 秒。','The read exceeded 10 seconds.'):T('示例原因：连接被拒绝。','Illustrative cause: connection refused.');document.querySelector('#app').innerHTML=`<section class="gate" aria-labelledby="gate-title"><div class="gate-symbol ${starting?'is-starting':failed?'failed-symbol':'unknown-symbol'}">${starting?'<span class="core-blocks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>':icon(failed?'warning':unknown?'clock':'cloud')}</div><h1 id="gate-title">${title}</h1><p>${copy}</p>${starting?`<div class="gate-status" role="status"><span class="spinner" aria-hidden="true"></span>${T('正在等待 Core 就绪 · 自动检查中','Waiting for Core readiness · checking automatically')}</div><button class="text-btn gate-link" data-do="core-info">${T('查看启动状态','View startup status')}</button>`:`<details class="diagnostic"><summary>${T('查看原因','View cause')}</summary><dl><dt>${T('本次状态','Status')}</dt><dd>${cause}</dd><dt>Core</dt><dd>http://core.example:17871</dd></dl></details><div class="gate-actions"><button class="primary" data-do="check-core">${T('重新检查','Check again')}</button><button class="text-btn" data-do="core-info">${T('连接与诊断','Connection and diagnostics')}</button></div>`}<div class="hint">${starting?T('启动期间暂不开放 Work 操作；现有任务不会因页面等待而取消。','Work actions are temporarily unavailable during startup. Existing tasks continue independently.'):T('当前未开放 Work 操作，重新确认就绪后会恢复。','Work actions will become available once readiness is confirmed.')}<br>${T('你仍可从右上角管理账号。','Account controls remain available in the top right.')}</div></section>`}
function renderInterrupted(){const recovering=scene==='interrupted';document.querySelector('#app').innerHTML=`<div class="workspace"><div class="workspace-bar"><button data-do="back-works">${T('返回列表','Back to Works')}</button><strong>视频策划2</strong>${coreButton(recovering?T('正在恢复','Recovering'):T('已连接','Connected'),recovering?'amber':'green')}</div><div ${recovering?'':'hidden'} class="inline-recovery" role="status">${icon('clock')}<span>${T('Core 正在恢复，业务操作已暂停。已输入的内容会保留，就绪后自动恢复操作。','Core is recovering. Work actions are paused. Your draft is preserved and actions resume when Core is ready.')}</span><button class="text-btn" data-do="core-info">${T('查看状态','View status')}</button></div><div class="workspace-tabs"><span>Chat</span><span>Files</span><span>Services</span></div><div class="workspace-content"><p>${T('已读取的对话内容仍可查看。','Previously loaded conversation content remains readable.')}</p><textarea id="draft" class="draft" aria-label="${T('保留的草稿','Preserved draft')}" ${recovering?'readonly':''}>${draftText??T('帮我整理下一期视频的选题和拍摄提纲……','Help me outline the topic and filming plan for the next video…')}</textarea><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="primary" data-do="send" ${recovering?'disabled':''}>${T('发送','Send')}</button></div></div></div>`}
function showDialog(title,sub,body,kind='other'){closeMenu();lastFocus=document.activeElement;document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-sub').textContent=sub;document.querySelector('#dialog-sub').hidden=!sub;document.querySelector('#dialog-body').innerHTML=body;document.querySelector('#dialog-done').textContent=T('关闭','Close');document.querySelector('#dialog').dataset.kind=kind;if(!document.querySelector('#dialog').open)document.querySelector('#dialog').showModal()}
function closeDialog(){document.querySelector('#dialog').close();if(lastFocus?.isConnected)lastFocus.focus()}
function closeMenu(){document.querySelector('#menu').hidden=true;document.querySelectorAll('[aria-expanded="true"]').forEach(el=>el.setAttribute('aria-expanded','false'))}
function showMenu(i,button){const wasOpen=!document.querySelector('#menu').hidden&&menuWork===i;closeMenu();if(wasOpen)return;menuWork=i;const current=failedScenes.includes(scene)&&i===0;const entries=[...(current?[['clock','current-task',T('查看当前任务','View current task')]]:[]),['info','info',T('Work 信息','Work information')],['settings','settings',T('设置','Settings')],['clock','history',T('操作记录','Operation history')],['download','export',T('导出 Work','Export Work')],['stop','stop',T('停止 Work','Stop Work')],['trash','delete',T('删除 Work','Delete Work')]];const menu=document.querySelector('#menu');menu.innerHTML=`<div class="menu-label">${workNames[i]}</div>${entries.map(([glyph,action,label],n)=>`${n===entries.length-1?'<div class="divider"></div>':''}<button role="menuitem" data-do="${action}" data-work="${i}" class="${action==='delete'?'danger':''}" ${action==='current-task'?'data-current-task':''}>${icon(glyph)}${label}</button>`).join('')}`;menu.hidden=false;button.setAttribute('aria-expanded','true');const r=button.getBoundingClientRect();menu.style.left=Math.max(8,Math.min(r.right-230,innerWidth-238))+'px';menu.style.top=Math.max(8,Math.min(r.bottom+8,innerHeight-menu.offsetHeight-12))+'px';menu.querySelector('button').focus()}
function historyRecords(i){const old=i===0?[0,1,2,3,4].map(n=>({id:'op-demo-retry-'+(5-n),name:T('重试 Work','Retry Work'),state:'failed',time:`10:0${8-n}:12`,date:T('本次恢复之前','Before this recovery'),historical:true})):[];const current=failedScenes.includes(scene)&&i===0?{id:'op-demo-current',name:T('重试 Work','Retry Work'),state:scene==='pending'?'unknown':'failed',time:'10:12:03',date:T('当前任务','Current task'),historical:false}:null;const success=current?[]:[{id:'op-demo-start',name:T('启动 Work','Start Work'),state:'succeeded',time:'10:12:03',date:T('最近一次已完成操作','Most recent completed operation'),historical:true}];return [...(current?[current]:success),...old]}
function taskLabel(state){return state==='failed'?T('失败','Failed'):state==='unknown'?T('未确认','Unconfirmed'):T('成功','Succeeded')}
function showHistory(i,filter='all'){selectedWork=i;historyFilter=filter;const records=historyRecords(i),display=records.filter(r=>filter==='all'||(filter==='active'?!r.historical:r.historical));const ready=currentState(i)==='ready';const summary=ready?`${icon('check')}<span>${T('Work 当前已就绪。以下为历史操作的原始结果，不影响当前可用状态。','This Work is ready. These are the original outcomes of past operations and do not describe its current availability.')}</span>`:`${icon('info')}<span>${T('当前任务与已结束的历史分别展示。未确认任务会保留原操作并继续核对。','Current tasks are separate from completed history. Unconfirmed tasks retain their original identities for checking.')}</span>`;showDialog(T('操作记录','Operation history'),workNames[i],`<div class="summary ${ready?'':'problem'}">${summary}</div><div class="filters" aria-label="${T('筛选操作','Filter operations')}">${[['all',T('全部','All')],['active',T('当前任务','Current')],['history',T('已结束','Completed')]].map(([key,label])=>`<button data-do="history-filter" data-filter="${key}" aria-pressed="${key===filter}">${label}</button>`).join('')}</div>${display.length?display.map(r=>`<div class="history-row"><div><div class="history-title">${r.name}</div><div class="history-sub">${r.date} · ${r.time}<br>${r.id}</div></div><div class="history-end"><span class="badge ${r.state==='failed'?'red':r.state==='unknown'?'amber':'green'}"><span class="dot"></span>${taskLabel(r.state)}</span><button class="text-btn" data-do="task-details" data-id="${r.id}">${T('查看详情','View details')}</button></div></div>`).join(''):`<div class="empty-history">${T('没有需要继续处理的当前任务','No current tasks require attention')}</div>`}`,'history')}
function showTask(i,id,fromHistory=false){selectedWork=i;const r=historyRecords(i).find(r=>r.id===id)||historyRecords(i)[0],unknown=r.state==='unknown',historical=r.historical,failed=r.state==='failed';const explanation=unknown?T('提交响应未完整返回，暂时无法确认原操作结果。请核对原操作；确认前不会再次发送重试请求。','The submission response was interrupted. Check the original operation before attempting another retry.'):failed?T('该次操作已明确失败。示例原因：Agent 启动未在规定时间内完成。','This operation failed. Illustrative cause: Agent startup did not finish within the allowed time.'):T('该次操作已完成。Work 当前状态以最新读取结果为准。','This operation completed. The Work state comes from its latest confirmed observation.');showDialog(r.name,workNames[i],`${fromHistory?`<button class="back" data-do="back-history">← ${T('返回操作记录','Back to operation history')}</button>`:''}<div class="detail-state ${unknown?'amber':failed?'red':'green'}">${icon(unknown?'clock':failed?'warning':'check')}${taskLabel(r.state)}</div><p class="detail-body">${explanation}</p>${historical&&currentState(i)==='ready'?`<div class="summary">${icon('check')}<span>${T('Work 当前已恢复为可用；这条历史记录保留原始结果。','This Work has recovered. This historical record keeps its original outcome.')}</span></div>`:''}<dl class="properties"><dt>${T('所属 Work','Work')}</dt><dd>${workNames[i]}</dd><dt>Operation ID</dt><dd><code>${r.id}</code></dd><dt>${T('原始结果','Outcome')}</dt><dd>${taskLabel(r.state)}</dd><dt>${T('记录归属','Record')}</dt><dd>${historical?T('已结束的历史操作','Completed history'):T('当前需要处理的任务','Current task')}</dd></dl>${!historical?`<div class="detail-actions"><button class="${unknown?'primary':'secondary'}" data-do="check-original">${T('检查原操作','Check original operation')}</button>${!unknown?`<button class="primary" data-do="retry-explicit">${T('重新尝试','Try again')}</button>`:''}</div>`:''}`,'details')}
function showCore(){const starting=['starting','interrupted'].includes(scene);showDialog(T('Core 状态','Core status'),T('当前连接','Current connection'),`<div class="detail-state ${starting?'amber':scene==='ready'?'green':'muted'}">${icon(starting?'clock':'info')}${starting?T('正在启动恢复','Starting recovery'):['core-failed','unconfirmed','offline'].includes(scene)?T('尚未确认就绪','Readiness not confirmed'):T('已连接且基础能力就绪','Connected and ready')}</div><p class="detail-body">${starting?T('系统正在准备运行环境并恢复持久化的 Work 目标。页面会自动检查，期间仅允许查看状态和账号操作。','The system is preparing its runtime and recovering saved Work targets. The page checks automatically; status and account actions remain available.'):T('此处显示连接和基础就绪状态。每个 Work 的运行状态独立核对。','This shows connection and base readiness. Each Work is checked independently.')}</p><dl class="properties"><dt>${T('地址','Address')}</dt><dd>http://core.example:17871</dd><dt>${T('检查方式','Check')}</dt><dd>${starting?T('有界自动只读检查','Bounded automatic read-only checks'):T('只读状态查询','Read-only status query')}</dd><dt>${T('示例数据','Demo data')}</dt><dd>${T('该原型没有连接真实 Core','This prototype does not connect to a live Core')}</dd></dl><div class="detail-actions"><button class="secondary" data-do="check-core">${T('重新检查状态','Check status again')}</button></div>`)}
function showScope(){showDialog('拟修复范围','供评审确认，尚未修改产品实现',`<ol class="scope-list"><li><strong>Core 启动门禁</strong>首次进入、刷新、直达 Work 路由均使用确认过的 Core readiness。恢复中屏蔽业务入口，就绪后自动展示；使用中断保留内容与草稿。</li><li><strong>失败、超时与断线出口</strong>分别显示真实失败、状态未确认和不可达。保留只读检查、账号和合法导航入口，不把旧状态持续当作当前事实。</li><li><strong>菜单与操作记录</strong>菜单只保留命令。旧 Retry 的原始失败结果保留到操作记录；当前失败、执行中及结果未知的任务保留检查路径与保护。</li><li><strong>刷新后的任务收敛</strong>同一身份重载时重新核对已知记录。已结束历史不能回流为当前告警；迟到的旧结果不能解除新操作的锁。</li><li><strong>重复 Retry 的来源调查</strong>按原 Operation ID、时间、错误与 Core 日志核实来源。发现重复提交或恢复调度问题时修复来源，并验证断线后不会自动重发用户写操作。</li><li><strong>实际重启验收</strong>覆盖真实 Core/Docker 重启、多条失败历史、单个 Work 恢复、未知结果、直达路由和身份切换，再重新打包 GUI 供复查。</li></ol><p class="small muted">本页仅包含原型和拟议行为。具体失败原因需要现场操作详情与日志确认。</p>`,'scope')}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3800)}
document.querySelector('#scene').onchange=e=>setScene(e.target.value);document.querySelector('#language').onclick=()=>{language=language==='zh'?'en':'zh';closeDialog();closeMenu();render()};document.querySelector('#finish-demo').onclick=()=>setScene(scene==='interrupted'?'workspace-ready':'ready');document.querySelector('#scope').onclick=showScope;document.querySelector('#account').onclick=()=>showDialog(T('账号','Account'),'admin',`<p class="detail-body">${T('Core 启动期间，语言、退出和适用于当前连接模式的切换入口仍然可用。','Language, sign-out and connection switching where supported remain available during startup.')}</p><div class="detail-actions"><button data-do="language">${T('切换语言','Change language')}</button><button data-do="demo-account">${T('退出登录','Sign out')}</button></div>`);document.querySelector('#close-dialog').onclick=closeDialog;document.querySelector('#dialog-done').onclick=closeDialog;
document.addEventListener('click',e=>{const b=e.target.closest('[data-do]');if(!b){if(!e.target.closest('#menu'))closeMenu();return}const action=b.dataset.do,i=Number(b.dataset.work??selectedWork);if(action==='menu'){showMenu(i,b);return}if(action==='history'){showHistory(i);return}if(action==='history-filter'){showHistory(selectedWork,b.dataset.filter);return}if(action==='task-details'){showTask(selectedWork,b.dataset.id,true);return}if(action==='back-history'){showHistory(selectedWork,historyFilter);return}if(action==='current-task'){showTask(i,'op-demo-current');return}if(action==='core-info'){showCore();return}if(action==='check-core'){const interrupted=scene==='interrupted';closeDialog();b.disabled=true;toast(T('原型：只读重新检查中，不会启动或重试 Work。','Prototype: checking status only; no Work is started or retried.'));checkTimer=setTimeout(()=>interrupted?toast(T('原型：Core 仍在恢复，草稿保持不变。','Prototype: Core is still recovering; the draft is preserved.')):setScene('ready'),1300);return}if(action==='check-original'){b.disabled=true;b.textContent=T('正在核对…','Checking…');checkTimer=setTimeout(()=>{b.disabled=false;b.textContent=T('检查原操作','Check original operation');toast(T('原型：原操作仍为当前状态，没有重复提交重试。','Prototype: the original state is unchanged. No retry was submitted.'))},900);return}if(action==='retry-explicit'){showDialog(T('重新尝试','Try again'),workNames[i],`<p class="detail-body">${T('仅在用户明确点击并通过当前准入检查后，才提交一次新的重试。旧失败记录继续保留到操作记录。此原型未发送真实请求。','A new retry is submitted only after an explicit click and current admission checks. The previous failure remains in history. This prototype sends no requests.')}</p>`);return}if(action==='language'){document.querySelector('#language').click();return}if(action==='recovering-task'){showDialog(T('Work 正在恢复','Work is recovering'),workNames[i],`<p class="detail-body">${T('Core 已就绪，该 Work 仍在自动恢复中。无需再次点击启动或重试。','Core is ready; this Work is still recovering automatically. No additional start or retry is needed.')}</p>`);return}if(action==='back-works'){setScene(scene==='workspace-ready'?'ready':'starting');return}if(action==='open'){showDialog(T('打开 Work','Open Work'),workNames[i],`<p class="detail-body">${T('这个 Work 的当前状态已确认可用，正常进入工作区。原型只演示入口，不连接业务服务。','This Work is confirmed usable and can open normally. The prototype demonstrates the entry without connecting to a service.')}</p>`);return}if(action==='info'){showDialog(T('Work 信息','Work information'),workNames[i],`<dl class="properties"><dt>${T('名称','Name')}</dt><dd>${workNames[i]}</dd><dt>Work ID</dt><dd>${workIds[i]}</dd><dt>${T('当前状态','State')}</dt><dd>${currentState(i)}</dd></dl><div class="detail-actions"><button data-do="history" data-work="${i}">${T('查看操作记录','View operation history')}</button></div>`);return}closeMenu();toast(T('原型演示：该入口可用，未执行真实业务操作。','Prototype: this entry is available; no real action was performed.'))});
document.addEventListener('input',e=>{if(e.target.id==='draft')draftText=e.target.value;if(e.target.id==='search')document.querySelector('#rows').innerHTML=workRows(e.target.value)});document.addEventListener('keydown',e=>{const menu=document.querySelector('#menu');if(e.key==='Escape'){if(!menu.hidden){const trigger=document.querySelector(`[data-do="menu"][data-work="${menuWork}"]`);closeMenu();trigger?.focus()}return}if(!menu.hidden&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const items=[...menu.querySelectorAll('button')],index=items.indexOf(document.activeElement),next=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[next].focus()}});addEventListener('resize',closeMenu);render();
</script>
</body></html>
