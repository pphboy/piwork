<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piwork 状态展示原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#17293f;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}header{height:64px;background:#fff;border-bottom:1px solid #e0e9f3;display:flex;align-items:center;padding:0 4%;gap:26px}header b{color:#1265cc;font-size:21px}header span{color:#667b94}header .user{margin-left:auto;color:#26374a}main{max-width:1080px;margin:56px auto;padding:0 20px}.demo{background:#eaf2ff;border:1px solid #d3e3fd;border-radius:10px;padding:16px 20px;margin-bottom:30px;color:#375374}.demo strong{display:block;margin-bottom:10px}.choices{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #dce6f2;background:white;color:#283d56;border-radius:7px;padding:9px 13px}button:hover{background:#f4f8fd}.choices button.active{background:#0863d8;color:white;border-color:#0863d8}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;color:#617c9b}.heading{display:flex;align-items:center;justify-content:space-between}.heading h1{font-size:30px;margin:15px 0 4px}.heading p{color:#6f829c;margin:0}.actions{display:flex;gap:10px}.plus{background:#0863d8;color:white;font-size:22px;border:0}.searchline{display:flex;justify-content:space-between;align-items:center;margin:32px 0 16px}.search{border:1px solid #dce7f4;border-radius:7px;background:white;padding:12px 15px;width:300px;color:#8796a9}.connection{color:#627991;font-size:13px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#bd8a24;margin-right:8px}.alert{border:1px solid #f1d9a9;background:#fff8ea;color:#865d17;border-radius:8px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}.alert.boot{background:#edf5ff;border-color:#cfe2fb;color:#294e7d;align-items:center;padding:16px 18px}.boot-icon{width:34px;height:34px;border-radius:9px;background:#dcecff;display:grid;place-items:center;flex:none}.boot-icon .spin{width:16px;height:16px;margin:0;border-color:#a7c9f4;border-top-color:#1667cd}.boot .boot-copy{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.boot strong{margin:0;white-space:nowrap}.boot p{color:#607d9d;font-size:13px;margin:0}.boot .boot-label{font-size:12px;font-weight:600;color:#4773a7;margin-left:auto;white-space:nowrap}.alert.ok{background:#f0faf6;border-color:#ccebdd;color:#246a50}.alert.error{background:#fff2f1;border-color:#f0c9c4;color:#9a3d32}.alert strong{display:block;margin-bottom:4px}.alert p{margin:0;line-height:1.5}.alert button{margin-left:auto;white-space:nowrap}.table{background:#fff;border:1px solid #dce7f3;border-radius:10px;margin-top:14px;overflow:hidden}.tr{display:grid;grid-template-columns: 1fr 180px 130px 30px;align-items:center;gap:12px;padding:20px;border-top:1px solid #e4edf7}.tr.head{background:#f8fafc;border:0;color:#617791;font-size:11px;letter-spacing:.8px;font-weight:700;padding:15px 20px}.name{display:flex;gap:16px;align-items:center}.icon{width:44px;height:44px;border-radius:10px;background:#eaf1fb;color:#6a8ab1;display:grid;place-items:center;font-size:22px}.name strong{display:block}.name small{display:block;color:#8293a8;margin-top:7px}.status{font-weight:600;font-size:13px;color:#556a82}.status.ready{color:#168263}.status.starting{color:#9b6811}.status.failed{color:#bd5147}.status .dot{background:currentColor}.status small{display:block;font-weight:400;color:#8293a8;margin:6px 0 0 15px}.link{border:0;padding:0;background:none;font-weight:600;text-align:left}.more{border:0;background:none;font-size:20px;padding:0}.foot{color:#8293a8;font-size:13px;display:flex;justify-content:space-between;margin-top:15px}.workspace-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}.workspace-bar h1{font-size:28px;margin:0;white-space:nowrap}.workspace-bar .search{width:300px;flex:0 1 300px;min-width:180px;height:46px;display:flex;align-items:center}.workspace-bar #notice{margin-left:auto}.workspace-bar .actions{margin-left:4px}.workspace-bar .actions button{height:46px;min-width:46px}.workspace-bar .plus{font-size:22px}.core-inline{display:flex;align-items:center;gap:8px;border:1px solid #cfe2fb;border-radius:8px;background:#edf5ff;padding:0 14px;height:46px;color:#294e7d;font-size:13px;white-space:nowrap}.core-inline .spin{margin:0;border-color:#a7c9f4;border-top-color:#1667cd}.core-inline.ok{background:#f0faf6;border-color:#ccebdd;color:#246a50}.core-inline.error{background:#fff2f1;border-color:#f0c9c4;color:#9a3d32}@media(max-width:650px){.workspace-bar .search{flex:1 1 100%;width:100%}.workspace-bar #notice{margin-left:0;flex:1}.workspace-bar .actions{margin-left:0}.core-inline{white-space:normal}}.note{margin-top:28px;color:#667c95;line-height:1.7;font-size:13px}.spin{display:inline-block;width:12px;height:12px;border:2px solid #e6c991;border-top-color:#9b6811;border-radius:50%;margin-right:6px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}@media(max-width:650px){main{margin-top:25px}.tr{grid-template-columns:1fr 105px 34px;gap:8px;padding:15px}.tr .quick{display:none}.name small{overflow-wrap:anywhere}.search{width:55%}.alert{flex-wrap:wrap}.alert button{margin-left:24px}}
.workspace-bar{display:flex;flex-wrap:nowrap;align-items:center;gap:12px;margin:0 0 20px;min-height:48px}.workspace-bar .search{display:flex;align-items:center;flex:0 1 320px;width:320px;height:48px;min-width:0;padding:0 16px;background:#fff;border:1px solid #dce7f3;border-radius:8px;font-size:14px}.workspace-bar #notice{display:flex;align-items:center;margin-left:auto}.core-inline{height:40px;padding:0 13px;gap:8px;border-radius:8px;background:#eaf3ff;border:1px solid #d7e8ff;color:#315e90;font-size:13px}.core-inline span:last-child{color:#6783a2}.workspace-bar .actions{display:flex;align-items:center;gap:8px;margin:0 0 0 8px}.workspace-bar .actions button{display:grid;place-items:center;width:42px;min-width:42px;height:42px;padding:0;border-radius:8px;font-size:18px;color:#526b86}.workspace-bar .actions .plus{width:42px;background:#0863d8;color:#fff;font-size:23px}.table{margin-top:0}@media(max-width:650px){.workspace-bar{flex-wrap:wrap;gap:10px}.workspace-bar .search{order:0;flex:1 1 calc(100% - 154px);width:auto}.workspace-bar .actions{order:1;margin:0}.workspace-bar #notice{order:2;margin:0;flex:1 1 100%}.core-inline{width:100%;height:40px;white-space:normal}}.core-inline{background:transparent;border:0;padding:0 4px;color:#627991;font-size:13px;gap:8px}.core-inline strong{font-weight:500}.core-inline.ok,.core-inline.error{background:transparent;border:0}.core-inline .spin{width:13px;height:13px;border-width:2px;border-color:#bfd1e5;border-top-color:#5681b1}</style></head><body><header><b>▦</b><span>Desktop</span><span class="user">● &nbsp; admin ⌄</span></header><main><div class="demo"><strong>状态原型 · 切换场景查看</strong><div class="choices"><button data-mode="recover" class="active">启动恢复中</button><button data-mode="ready">恢复完成</button><button data-mode="failed">恢复失败</button></div></div><div class="workspace-bar"><div class="search">⌕ &nbsp; Search your Works</div><div id="notice"></div><div class="actions"><button title="刷新">⟳</button><button title="导入">⇧</button><button class="plus" title="新建">＋</button></div></div><div class="table"><div class="tr head"><span>NAME</span><span>STATUS</span><span class="quick">QUICK ACTION</span><span></span></div><div id="rows"></div></div><div class="foot"><span>♙ &nbsp; Only your own Works appear here</span><span>4 Works &nbsp; · &nbsp; admin</span></div><p class="note">评审说明：本页面使用示意数据。顶部状态表达 Core 的恢复情况；每行仅表达该 Work 的当前状态。已完成的创建、启动或重试记录可在操作详情中查看，不附在行状态后。</p></main><script>
const works=[['示例 Work','work-example-0001'],['B','work-example-0002'],['C','work-example-0003'],['A','work-example-0004']];
const states={recover:[['Stopped',''],['Ready',''],['Starting','恢复中'],['Starting','等待恢复']],ready:[['Stopped',''],['Ready',''],['Ready',''],['Ready','']],failed:[['Stopped',''],['Ready',''],['Failed','恢复未完成'],['Ready','']]};
function show(mode){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelector('#notice').innerHTML=mode==='recover'?'<div class="core-inline" role="status" title="正在准备运行环境和恢复 Work，状态会自动更新"><span class="spin"></span><strong>Core 启动中</strong></div>':mode==='ready'?'<div class="core-inline ok"><span class="dot" style="background:#168263;margin:0"></span><strong>Core 已就绪</strong></div>':'<div class="core-inline error"><span class="dot" style="background:#bd5147;margin:0"></span><strong>Core 恢复失败</strong><span>· 查看详情</span></div>';document.querySelector('#rows').innerHTML=works.map((w,i)=>{let [s,detail]=states[mode][i];let action=s==='Stopped'?'▶ &nbsp; Start Work':s==='Ready'?'Open Work':s==='Failed'?'查看详情':'查看进度';return `<div class="tr"><div class="name"><div class="icon">⊞</div><div><strong>${w[0]}</strong><small>${w[1]}</small></div></div><div class="status ${s.toLowerCase()}">${s==='Starting'?'<span class="spin"></span>':'<span class="dot"></span>'}${s}${detail?`<small>${detail}</small>`:''}</div><div class="quick"><button class="link">${action}</button></div><button class="more" aria-label="更多选项">···</button></div>`}).join('')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>show(b.dataset.mode));show('recover');
</script></body></html>
