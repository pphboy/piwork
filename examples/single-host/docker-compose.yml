name: piwork-single-host
# Liveness keeps first-time setup accessible; /readyz tracks runtime preparation.
services:
  core:
    image: docker.io/pphboy/piwork-core:0.0.9-0901cf119dc1-0e1261f05b9d
    init: true
    user: "0:0"
    network_mode: host
    command: ["serve", "--data-dir", "/var/lib/piwork/examples/single-host/core", "--no-open", "--core-listen", "0.0.0.0:17871"]
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/piwork/examples/single-host/core
        target: /var/lib/piwork/examples/single-host/core
        bind:
          create_host_path: true
    stop_grace_period: 60s
    restart: unless-stopped
  cli:
    image: docker.io/pphboy/piwork-cli:0.0.9-0901cf119dc1-0e1261f05b9d
    profiles: [cli]
    init: true
    user: "0:0"
    stdin_open: true
    tty: true
    environment:
      PIWORK_CORE_URL: http://host.docker.internal:17871
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - client-state:/var/lib/piwork/client
volumes:
  client-state:
    name: piwork-single-host-client-state
