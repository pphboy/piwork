name: piwork-single-host
# Liveness keeps first-time setup accessible; /readyz tracks runtime preparation.
services:
  core:
    image: docker.io/pphboy/piwork-core:0.0.11-a19c6f595fa6-d60025d65577
    init: true
    user: "0:0"
    network_mode: host
    command: ["--data-dir", "/var/lib/piwork/examples/single-host/core"]
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/piwork/examples/single-host/core
        target: /var/lib/piwork/examples/single-host/core
        bind:
          create_host_path: true
    stop_grace_period: 60s
    restart: unless-stopped
