syntax = "proto3";

package piwork.agent.v1;

service AgentService {
  rpc RefreshServiceInteractionBindings(AgentContentRequest) returns (AgentContentResponse);
  rpc Readiness(ReadinessRequest) returns (ReadinessResponse);
  rpc PrepareConfigurationChange(PrepareConfigurationChangeRequest) returns (PrepareConfigurationChangeResponse);
  rpc Drain(DrainRequest) returns (DrainResponse);
  rpc CreateSession(CreateSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ReadSession(ReadSessionRequest) returns (SessionHistory);
  rpc GetSessionHistoryCapabilities(AgentContentRequest) returns (AgentContentResponse);
  rpc ReadSessionPage(ReadSessionPageRequest) returns (SessionHistoryPage);
  rpc GetChatImageCapabilities(AgentContentRequest) returns (AgentContentResponse);
  rpc ReadSessionImage(ReadSessionImageRequest) returns (SessionImage);
  rpc SubmitRun(SubmitRunRequest) returns (SubmitRunResponse);
  rpc GetRun(GetRunRequest) returns (Run);
  rpc GetActiveRun(GetActiveRunRequest) returns (GetActiveRunResponse);
  rpc WatchRun(WatchRunRequest) returns (stream RunEvent);
  rpc CancelRun(CancelRunRequest) returns (Run);
  rpc ListRunModels(AgentContentRequest) returns (AgentContentResponse);
  rpc SetSessionModel(AgentContentRequest) returns (Session);
  rpc ListChatModels(AgentContentRequest) returns (AgentContentResponse);
  rpc ListSlashCommands(AgentContentRequest) returns (AgentContentResponse);
  rpc GetSessionChatOptions(AgentContentRequest) returns (AgentContentResponse);
  rpc SetSessionChatOptions(AgentContentRequest) returns (AgentContentResponse);
  rpc LookupChatSubmission(AgentContentRequest) returns (AgentContentResponse);
  rpc ListAgentRequests(AgentContentRequest) returns (AgentContentResponse);
  rpc GetAgentRequest(AgentContentRequest) returns (AgentContentResponse);
  rpc CancelAgentRequest(AgentContentRequest) returns (AgentContentResponse);
  rpc RetryAgentRequest(AgentContentRequest) returns (AgentContentResponse);
  rpc LookupAgentRequestRetrySubmission(AgentContentRequest) returns (AgentContentResponse);
  rpc GetAgentEvidence(AgentContentRequest) returns (AgentContentResponse);
}

message AgentContentRequest {
  string work_id = 1;
  string object_id = 2;
  string input_json = 3;
}
message AgentContentResponse { string value_json = 1; }

message ReadinessRequest {
  string work_id = 1;
  uint64 generation = 2;
  string instance_id = 3;
}

message ReadinessResponse {
  string work_id = 1;
  uint64 generation = 2;
  string instance_id = 3;
  string protocol_version = 4;
  bool accepting_runs = 5;
  bool draining = 6;
  uint32 context_contract_version = 7;
  string context_identity = 8;
  bool initialization_complete = 9;
  repeated LoadedSkill loaded_skills = 10;
  repeated string resolved_tools = 11;
  uint32 active_run_count = 12;
  uint32 package_contract_version = 13;
  repeated LoadedPackage loaded_packages = 14;
  repeated PackageResource package_resources = 15;
  repeated PackageDiagnostic package_diagnostics = 16;
  uint32 run_model_contract_version = 17;
  uint32 work_feedback_contract_version = 18;
  uint32 work_history_schema_version = 19;
  uint32 chat_controls_contract_version = 20;
  optional uint32 model_provider_contract_version = 21;
  optional uint32 cancel_and_send_contract_version = 22;
}

message LoadedPackage {
  string name = 1;
  string content_digest = 2;
  uint32 extensions = 3;
  uint32 skills = 4;
  uint32 prompts = 5;
  uint32 themes = 6;
}

message PackageResource {
  string package_name = 1;
  string kind = 2;
  string name = 3;
}

message PackageDiagnostic {
  string package_name = 1;
  string code = 2;
  string message = 3;
}

message LoadedSkill {
  string name = 1;
  string identity = 2;
  bool loaded = 3;
  bool model_visible = 4;
  string visibility_reason = 5;
}

message PrepareConfigurationChangeRequest {
  string work_id = 1;
  uint64 generation = 2;
  string instance_id = 3;
}

message PrepareConfigurationChangeResponse {
  bool prepared = 1;
  bool busy = 2;
  uint32 active_run_count = 3;
}

message DrainRequest {
  string work_id = 1;
  uint64 generation = 2;
  string instance_id = 3;
  uint32 timeout_ms = 4;
}

message DrainResponse { bool drained = 1; }

message Session {
  string work_id = 1;
  string session_id = 2;
  string sdk_history_path = 3;
  string created_at = 4;
  string updated_at = 5;
  string model_preference_json = 6;
  string source_json = 7;
  string thinking_level = 8;
  bool thinking_unrequested = 9;
  optional string thinking_profile = 10;
}

message CreateSessionRequest {
  string work_id = 1;
  string idempotency_key = 2;
}

message ListSessionsRequest {
  string work_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
}

message ReadSessionRequest {
  string work_id = 1;
  string session_id = 2;
  optional string image_profile = 3;
}

// Page JSON is the shared, strictly validated HTTP projection. Keeping one
// representation also makes its escaped byte budget identical on both hops.
message ReadSessionPageRequest {
  string work_id = 1;
  string session_id = 2;
  string query_json = 3;
}
message SessionHistoryPage { string page_json = 1; }

message ImageInput { string mime_type = 1; bytes data = 2; }
message ImageDescriptor { string mime_type = 1; uint32 byte_size = 2; string sha256 = 3; uint32 image_index = 4; }
message ReadSessionImageRequest { string work_id = 1; string session_id = 2; string run_id = 3; uint32 image_index = 4; }
message SessionImage { string work_id = 1; string session_id = 2; string run_id = 3; uint32 image_index = 4; ImageDescriptor image = 5; bytes data = 6; }

message SessionHistory {
  Session session = 1;
  repeated SessionMessage messages = 2;
 repeated Run runs = 3;
}

message SessionMessage {
  string entry_id = 1;
  string role = 2;
  string text = 3;
  string created_at = 4;
  repeated SessionContentBlock blocks = 5;
  string run_id = 6;
}

message SessionContentBlock {
  string block_id = 1;
  string type = 2;
  string text = 3;
  string tool_call_id = 4;
  string tool_name = 5;
  string result_preview_json = 6;
  ImageDescriptor image = 7;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_ACCEPTED = 1;
  RUN_STATE_RUNNING = 2;
  RUN_STATE_CANCELLING = 3;
  RUN_STATE_SUCCEEDED = 4;
  RUN_STATE_FAILED = 5;
  RUN_STATE_CANCELLED = 6;
  RUN_STATE_INTERRUPTED = 7;
}

message RunError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message Run {
  string work_id = 1;
  string session_id = 2;
  string run_id = 3;
  string submission_key = 4;
  RunState state = 5;
  string prompt_digest = 6;
  string final_text = 7;
  RunError error = 8;
  string accepted_at = 9;
  string started_at = 10;
  string finished_at = 11;
  uint64 earliest_available_sequence = 12;
  uint64 latest_sequence = 13;
  string actual_model_json = 14;
  string source_json = 15;
  uint32 adopted_experience_version = 16;
  string thinking_level = 17;
  bool thinking_unrequested = 18;
  optional string result_ref_json = 19;
  optional string thinking_profile = 20;
}

message SubmitRunRequest {
  string work_id = 1;
  string session_id = 2;
  string submission_key = 3;
  string prompt = 4;
  // Missing: Session preference; present empty: explicit Work default.
  optional string model_ref = 5;
  optional string input_mode = 6;
  repeated ImageInput images = 7;
  optional string cancel_run_id = 8;
  optional string response_profile = 9;
}

message SubmitRunResponse {
  Run run = 1;
  bool reused = 2;
}

message GetRunRequest {
  string work_id = 1;
  string run_id = 2;
  optional string response_profile = 3;
}

message GetActiveRunRequest { string work_id = 1; optional string response_profile = 2; }
message GetActiveRunResponse { Run run = 1; }

message WatchRunRequest {
  string work_id = 1;
  string run_id = 2;
  optional uint64 after_sequence = 3;
  optional string response_profile = 4;
}

message CancelRunRequest {
  string work_id = 1;
  string run_id = 2;
  string idempotency_key = 3;
  optional string response_profile = 4;
}

message TextEvent {
  string delta = 1;
  optional uint64 byte_offset = 2;
  optional uint64 total_bytes = 3;
  optional bool complete = 4;
}

message ToolEvent {
  string server_id = 1;
  string tool_name = 2;
  string tool_call_id = 3;
  string phase = 4;
  bool is_error = 5;
  string result_preview_json = 6;
}

message StateEvent {
  RunState state = 1;
  string final_text = 2;
  RunError error = 3;
  optional string result_ref_json = 4;
}

message RunEvent {
  string work_id = 1;
  string session_id = 2;
  string run_id = 3;
  uint64 sequence = 4;
  string created_at = 5;
  oneof kind {
    TextEvent text = 6;
    ToolEvent tool = 7;
    StateEvent state = 8;
  }
}
