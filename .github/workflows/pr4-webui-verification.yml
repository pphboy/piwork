name: PR 4 WebUI verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.repository == 'pphboy/piwork' &&
      github.event.repository.private == false &&
      github.event.pull_request.number == 4 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/standardize-webui-feedback-modules'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: visual-review, minutes: 15}
          - {suite: unit-static, minutes: 35}
          - {suite: agent-unit, minutes: 25}
          - {suite: desktop-browser, minutes: 60}
          - {suite: desktop-smoke, minutes: 20}
          - {suite: service-iframe, minutes: 20}
          - {suite: console-browser, minutes: 45}
          - {suite: real-core, minutes: 130}
          - {suite: integration-go, minutes: 150}
          - {suite: package-protocol, minutes: 35}
          - {suite: backend-engine, minutes: 60}
          - {suite: backend-drain, minutes: 75}
          - {suite: backend-history, minutes: 75}
    name: ${{ matrix.suite }}
    concurrency:
      group: pr4-webui-${{ github.event.pull_request.number }}-${{ matrix.suite }}${{ matrix.suite == 'desktop-browser' && '-bounded-tap-v1' || '' }}${{ matrix.suite == 'integration-go' && '-core-inventory-v2' || '' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    env:
      CI: 'true'
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PIWORK_TEST_NATIVE_HISTORY4_IMAGE: piwork-memory-history4-web-base:acceptance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Clean SDK state and locked dependencies
        run: |
          umask 077
          export PI_CODING_AGENT_DIR="$RUNNER_TEMP/piwork-sdk-clean"
          mkdir -m 700 "$PI_CODING_AGENT_DIR"
          test -z "$(ls -A "$PI_CODING_AGENT_DIR")"
          printf 'PI_CODING_AGENT_DIR=%s\n' "$PI_CODING_AGENT_DIR" >> "$GITHUB_ENV"
          npm ci
      - name: Install Chromium
        if: matrix.suite != 'unit-static' && matrix.suite != 'agent-unit' && matrix.suite != 'backend-engine' && matrix.suite != 'backend-drain'
        run: |
          npx --no-install playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from '@playwright/test'; console.log('PIWORK_TEST_BROWSER_BIN='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Build current source
        if: matrix.suite != 'integration-go'
        id: build
        run: make build
      - name: Unit, contracts and boundaries
        if: matrix.suite == 'unit-static' && !cancelled() && steps.build.outcome == 'success'
        run: make test
      - name: Complete Agent unit suite
        if: matrix.suite == 'agent-unit' && !cancelled() && steps.build.outcome == 'success'
        run: npm run test:unit -w @piwork/agentd
      - name: Generated sources and whitespace
        if: matrix.suite == 'unit-static' && !cancelled() && steps.build.outcome == 'success'
        run: |
          make check-generated check-generated-ui
          git diff --check
          node scripts/check-source-style.mjs --base "$PR_BASE_SHA"
      - name: Desktop browser
        if: matrix.suite == 'desktop-browser' && !cancelled() && steps.build.outcome == 'success'
        run: npm run test:browser -w @piwork/desktop-webui
      - name: Six-case Desktop diagnostic subset (not full acceptance)
        if: matrix.suite == 'desktop-smoke' && !cancelled() && steps.build.outcome == 'success'
        run: |
          npx --no-install tsc -p apps/desktop-webui/tsconfig.test.json
          pattern='^(browser signs in and out without exposing Core bearer to page storage|Create Work geometry stays stable during delayed feedback on a narrow viewport|D19 close preserves one automatic original download and a manual same-transfer fallback|Chat redesign: unknown submission checks the original key and never retries a missing mapping|file preview failure has one original read notice and successful retry retires it silently|FS52-A obsolete file refresh cannot publish an error into a newer selection)$'
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=120000 --test-concurrency=1 --test-name-pattern="$pattern" apps/desktop-webui/dist/test/browser.test.js apps/desktop-webui/dist/test/feedback.test.js | tee "$RUNNER_TEMP/piwork-desktop-smoke.tap"
          grep -Fx '# tests 6' "$RUNNER_TEMP/piwork-desktop-smoke.tap"
          grep -Fx '# pass 6' "$RUNNER_TEMP/piwork-desktop-smoke.tap"
          echo 'Exactly six diagnostic cases passed; unmatched cases were not executed. Full Desktop browser verification remains separate.'
      - name: Three native Service iframe ordering cases (not full acceptance)
        if: matrix.suite == 'service-iframe' && !cancelled() && steps.build.outcome == 'success'
        run: |
          npx --no-install tsc -p apps/desktop-webui/tsconfig.test.json
          pattern='^browser Service Stop Start barrier: (document-after-probe|unmounted-before-entry|old-probe-after-restart)$'
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=120000 --test-concurrency=1 --test-name-pattern="$pattern" apps/desktop-webui/dist/test/browser.test.js | tee "$RUNNER_TEMP/piwork-service-iframe.tap"
          grep -Fx '# tests 3' "$RUNNER_TEMP/piwork-service-iframe.tap"
          grep -Fx '# pass 3' "$RUNNER_TEMP/piwork-service-iframe.tap"
          grep -Fx '# skipped 0' "$RUNNER_TEMP/piwork-service-iframe.tap"
          echo 'Exactly three native Service ordering cases passed; full Desktop verification remains separate.'
      - name: Console browser
        if: matrix.suite == 'console-browser' && !cancelled() && steps.build.outcome == 'success'
        run: npm run test:browser -w @piwork/console-webui
      - name: Isolated runtime fixtures and reconstructed schema-4 source
        id: fixtures
        if: matrix.suite == 'real-core' || matrix.suite == 'integration-go' || matrix.suite == 'package-protocol' || startsWith(matrix.suite, 'backend-')
        timeout-minutes: 50
        run: |
          docker version
          command -v unzip
          df -h /
          docker pull python:3.13-slim
          if [[ '${{ matrix.suite }}' != integration-go ]]; then
            make native-compatibility-images native-helper-images workstation-fixture
          fi
          if [[ '${{ matrix.suite }}' == backend-engine ]]; then
            exit 0
          fi
          old=20fb8334f1dce93bfa79cb6b5c86acf1cc460963
          legacy="$RUNNER_TEMP/piwork-history4-source"
          mkdir "$legacy"
          git archive "$old" | tar -x -C "$legacy"
          echo "07179ce0116e6c1fb6f5db77f249ec2e1175ac43487d35b6eb0325f201fa73f9  $legacy/internal/workhistory/schema.sql" | sha256sum -c -
          docker build -f "$legacy/Dockerfile.agentd" --target acceptance --build-arg PIWORK_COMMIT="$old" --build-arg PIWORK_MODIFIED=false --build-arg GOPROXY=https://proxy.golang.org,direct --build-arg NPM_REGISTRY=https://registry.npmjs.org -t piwork-memory-history4:acceptance "$legacy"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' piwork-memory-history4:acceptance)" = "$old"
          test "$(docker image inspect --format '{{index .Config.Labels "io.piwork.source.modified"}}' piwork-memory-history4:acceptance)" = false
          test "$(docker image inspect --format '{{index .Config.Labels "io.piwork.work-history.schema"}}' piwork-memory-history4:acceptance)" = 4
          if [[ '${{ matrix.suite }}' == integration-go ]]; then
            echo 'Historical source reconstructed; the full runner prepares the current candidate and bridge once.'
            exit 0
          fi
          make native-history4-web-base-fixture
          test "$(docker image inspect --format '{{index .Config.Labels "io.piwork.fixture.web-base-history4"}}' "$PIWORK_TEST_NATIVE_HISTORY4_IMAGE")" = true
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' piwork-memory-history4:acceptance "$PIWORK_TEST_NATIVE_HISTORY4_IMAGE"
          echo "Reconstructed schema-4 fixture from $old; current-tree bridge changes deterministic driver and Service MCP only. No historical image digest claim."
          df -h /
      - name: Exact Package acceptance and actor-scope protocols
        if: matrix.suite == 'package-protocol' && !cancelled() && steps.fixtures.outcome == 'success'
        env:
          PIWORK_TEST_NATIVE_AGENT_IMAGE: piwork-agentd:go-migration-acceptance
          PIWORK_TEST_NATIVE_FILE_HELPER_IMAGE: piwork-file-helper:go-migration-acceptance
          PIWORK_TEST_NATIVE_SNAPSHOT_HELPER_IMAGE: piwork-snapshot-helper:go-migration-acceptance
        run: |
          set -o pipefail
          go test -mod=readonly -tags=integration -v -count=1 -timeout=15m -run '^(TestCorePackageHTTPPublishesAndReplaysFrozenContent|TestNativeAdministratorPackageScopeAndAcceptedJobSurviveRevocation)$' ./internal/coreapp | tee "$RUNNER_TEMP/piwork-package-protocol.log"
          grep -E '^--- PASS: TestCorePackageHTTPPublishesAndReplaysFrozenContent \([0-9.]+s\)$' "$RUNNER_TEMP/piwork-package-protocol.log"
          grep -E '^--- PASS: TestNativeAdministratorPackageScopeAndAcceptedJobSurviveRevocation \([0-9.]+s\)$' "$RUNNER_TEMP/piwork-package-protocol.log"
      - name: Desktop real Core
        id: desktop_real_core
        if: matrix.suite == 'real-core' && !cancelled() && steps.fixtures.outcome == 'success'
        timeout-minutes: 30
        env:
          PIWORK_TEST_SCREENSHOT_DIR: ${{ runner.temp }}/piwork-reviewed-screenshots
        run: npm run test:real-core -w @piwork/desktop-webui
      - name: Console real Core
        if: matrix.suite == 'real-core' && !cancelled() && steps.fixtures.outcome == 'success'
        timeout-minutes: 20
        run: npm run test:real-core -w @piwork/console-webui
      - name: Real Core log export
        if: matrix.suite == 'real-core' && !cancelled() && steps.fixtures.outcome == 'success'
        timeout-minutes: 20
        run: node apps/desktop-webui/test/log-export-real-core.mjs
      - name: Exact backend regression group (not full acceptance)
        if: startsWith(matrix.suite, 'backend-') && !cancelled() && steps.fixtures.outcome == 'success'
        env:
          PIWORK_TEST_NATIVE_AGENT_IMAGE: piwork-agentd:go-migration-acceptance
          PIWORK_TEST_NATIVE_FILE_HELPER_IMAGE: piwork-file-helper:go-migration-acceptance
          PIWORK_TEST_NATIVE_SNAPSHOT_HELPER_IMAGE: piwork-snapshot-helper:go-migration-acceptance
          PIWORK_TEST_NATIVE_OLD_SDK_IMAGE: piwork-agentd:go-migration-sdk-0860
          PIWORK_TEST_NATIVE_UNAVAILABLE_REGISTRY_IMAGE: piwork-agentd:go-migration-registry-unavailable
        run: |
          set -o pipefail
          case '${{ matrix.suite }}' in
            backend-engine)
              package=./internal/dockerengine
              names=(
                TestRealNativeAgentImageStaticCapabilitiesAndBuildEvidence
                TestRealManagedResourceLifecycleAndOwnership
              ) ;;
            backend-drain)
              package=./internal/coreapp
              names=(
                TestNativeCoreWebDAVUploadStopApplyRevocationAndRestart
                TestNativeMemoryMigrationProcessRecoveryAndStopSupersession
                TestNativeCoreProcessHealthIdentityRestartWithoutHostTools
                TestNativeSDKDeploysServiceThroughGoMCPAndCore
                TestNativeServiceRevisionsCounterAndRemoval
                TestNativeShutdownConfirmsOtherWorksAfterFailedAgentDrain
                TestNativeTemporaryCleanupRetriesAfterEngineReturns
                TestNativeSkillFailuresRemainSpecificAfterRollbackAndCoreRestart
              ) ;;
            backend-history)
              package=./internal/coreapp
              names=(
                TestNativeBrainWorkstationFeedbackExperienceAndActualCandidateBehavior
                TestNativeSchema4ConversationUpgradeRollbackAndDowngradeFence
                TestNativeSchema4ExperienceUpgradeRollbackAndDowngradeFence
                TestNativeChatModelSelectionRunsThroughGoAndRealSDK
                TestNativeCancelledCheckpointHistoryAfterEventCompaction
                TestNativeSnapshotMovesServicesContextsAndPackagesBetweenOfflineInstallations
              ) ;;
            *) exit 2 ;;
          esac
          pattern="^($(IFS='|'; echo "${names[*]}"))$"
          test_timeout=20m
          [[ '${{ matrix.suite }}' != backend-engine ]] || test_timeout=10m
          go test -mod=readonly -tags=integration -v -count=1 -timeout="$test_timeout" -run "$pattern" "$package" | tee "$RUNNER_TEMP/backend-group.log"
          for name in "${names[@]}"; do
            grep -E "^--- PASS: ${name} \([0-9.]+s\)$" "$RUNNER_TEMP/backend-group.log"
          done
          echo 'Exact targeted regression group passed; full Go integration remains mandatory and separate.'
      - name: Existing Go Engine integration
        if: matrix.suite == 'integration-go' && !cancelled() && steps.fixtures.outcome == 'success'
        run: make test-integration-go
      - name: Full Core integration evidence
        if: matrix.suite == 'integration-go' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-integration-${{ github.event.pull_request.head.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/core-integration/**/result.json
            dist/core-integration/**/plan.json
            dist/core-integration/**/unit-*.jsonl
            dist/core-integration/**/cleanup.log
            dist/core-integration/**/processes.jsonl
      - name: Requested synthetic Desktop screenshots
        if: matrix.suite == 'real-core' && !cancelled() && steps.desktop_real_core.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4
        with:
          name: desktop-screenshots-${{ github.event.pull_request.head.sha }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/piwork-reviewed-screenshots/02-service-and-chat.png
            ${{ runner.temp }}/piwork-reviewed-screenshots/03-files.png
            ${{ runner.temp }}/piwork-reviewed-screenshots/04-restored-work.png
            ${{ runner.temp }}/piwork-reviewed-screenshots/05-responsive-390.png
      - name: Three existing visual review cases (not full acceptance)
        if: matrix.suite == 'visual-review' && !cancelled() && steps.build.outcome == 'success'
        run: |
          set -o pipefail
          npx --no-install tsc -p apps/desktop-webui/tsconfig.test.json
          pattern='^(browser signs in and out without exposing Core bearer to page storage|browser opens a running Work Service in an iframe and a separate local tab)$'
          node --test --test-reporter=tap --test-timeout=120000 --test-concurrency=1 --test-name-pattern="$pattern" apps/desktop-webui/dist/test/browser.test.js | tee "$RUNNER_TEMP/visual-desktop.tap"
          grep -Fx '# tests 2' "$RUNNER_TEMP/visual-desktop.tap"
          grep -Fx '# pass 2' "$RUNNER_TEMP/visual-desktop.tap"
          (cd apps/console-webui && npx --no-install playwright test -c playwright.config.mjs console.spec.mjs --grep 'delivered workspaces retain every management deep link, mobile layout, and secret isolation$' --reporter=line) | tee "$RUNNER_TEMP/visual-console.log"
          grep -E '1 passed \(' "$RUNNER_TEMP/visual-console.log"
          for view in desktop-works desktop-work console-overview; do
            for width in 1440 360; do test -s "dist/logo-title-style/$view-$width.png"; done
          done
      - name: Requested six current UI views
        if: matrix.suite == 'visual-review' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: visual-review-${{ github.event.pull_request.head.sha }}
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false
          path: |
            dist/logo-title-style/desktop-works-1440.png
            dist/logo-title-style/desktop-works-360.png
            dist/logo-title-style/desktop-work-1440.png
            dist/logo-title-style/desktop-work-360.png
            dist/logo-title-style/console-overview-1440.png
            dist/logo-title-style/console-overview-360.png
